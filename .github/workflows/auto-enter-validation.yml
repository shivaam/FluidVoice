name: Auto Enter Preview Validation
on:
  push:
    branches: [codex/auto-enter-preview-validation]
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Standalone regressions
        run: |
          sh Tests/run_onboarding_tests.sh
          sh scripts/test_dictation_send.sh
          sh Tests/run_release_highlights_tests.sh
      - name: Full build and tests
        run: |
          set -o pipefail
          xcodebuild test -project Fluid.xcodeproj -scheme Fluid -destination 'platform=macOS,arch=arm64' -derivedDataPath preview-derived -resultBundlePath preview-tests.xcresult -skip-testing:FluidDictationIntegrationTests/DictationE2ETests/testDictationEndToEnd_whisperTiny_transcribesFixture CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO > preview-build.log 2>&1
      - name: Package preview
        run: |
          app=$(find preview-derived/Build/Products/Debug -maxdepth 1 -name '*.app' -type d | head -n 1)
          test -n "$app"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleIdentifier com.FluidApp.app.autoenterpreview' "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName FluidVoice Auto Enter Preview' "$app/Contents/Info.plist"
          codesign --force --deep --sign - "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" FluidVoice-Auto-Enter-Preview.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auto-enter-validation
          retention-days: 5
          path: |
            preview-build.log
            preview-tests.xcresult
            FluidVoice-Auto-Enter-Preview.zip
