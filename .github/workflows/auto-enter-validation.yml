name: Auto Enter Review Validation
on:
  push:
    branches: [codex/auto-enter-preview-validation]
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Run dictation send regressions
        run: sh scripts/test_dictation_send.sh
      - name: Build and test reviewed app
        run: |
          set -o pipefail
          xcodebuild test -project Fluid.xcodeproj -scheme Fluid -configuration Debug -destination 'platform=macOS,arch=arm64' -derivedDataPath preview-derived -resultBundlePath ReviewTests.xcresult -skip-testing:FluidDictationIntegrationTests/DictationE2ETests/testDictationEndToEnd_whisperTiny_transcribesFixture CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO > preview-build.log 2>&1
      - name: Package preview
        run: |
          app=$(find preview-derived/Build/Products/Debug -maxdepth 1 -name '*.app' -type d | head -n 1)
          test -n "$app"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleIdentifier com.FluidApp.app.autoenterpreview' "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName FluidVoice Auto Enter Preview' "$app/Contents/Info.plist"
          # Preserve a raw build for local recovery if packaging fails.
          ditto -c -k --sequesterRsrc --keepParent "$app" Unsigned-Preview.zip
          # Use the same canonical framework repair as upstream pr-archive.yml.
          framework="$app/Contents/Frameworks/CTranscribe.framework"
          test -d "$framework/Versions/A"
          rm -rf "$framework/Versions/Current" "$framework/CTranscribe" "$framework/Resources" "$framework/Versions/A/_CodeSignature"
          ln -s A "$framework/Versions/Current"
          ln -s Versions/Current/CTranscribe "$framework/CTranscribe"
          ln -s Versions/Current/Resources "$framework/Resources"
          codesign --force --sign - --timestamp=none "$framework"
          codesign --force --sign - --timestamp=none "$app/Contents/Frameworks/MediaRemoteAdapter.framework"
          cp Fluid.entitlements preview.entitlements
          /usr/libexec/PlistBuddy -c 'Add :com.apple.security.device.audio-input bool true' preview.entitlements
          codesign --force --sign - --timestamp=none --options runtime --identifier com.FluidApp.app.autoenterpreview --entitlements preview.entitlements "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" FluidVoice-Auto-Enter-Preview.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auto-enter-validation
          retention-days: 5
          path: |
            preview-build.log
            FluidVoice-Auto-Enter-Preview.zip
            Unsigned-Preview.zip
